global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'smartpark-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'smartpark-monitor'
    static_configs:
      - targets: ['monitor:8001']
    scrape_interval: 5s

  - job_name: 'ml-service'
    static_configs:
      - targets: ['ml-service:8002']
    scrape_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'parking_alerts.yml'
